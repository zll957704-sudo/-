<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>三龙厂房｜五栋钢棚·斜角与光伏校核 V16</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080e17;color:#eff5fb;font:13px system-ui,"Microsoft YaHei",sans-serif}
canvas{display:block;width:100vw;height:100dvh;touch-action:none}header{position:fixed;left:8px;top:8px;z-index:4;max-width:min(300px,calc(100vw - 110px));padding:9px 11px;border:1px solid #4b687e;background:#122332ed;border-radius:10px;pointer-events:none}
header b{font-size:14px;color:#f7f7f1}header small{display:block;color:#b8d3e1;font-size:11px;line-height:1.45;margin-top:5px}
.panel{position:fixed;right:8px;top:9px;z-index:5;width:min(225px,calc(100vw - 16px));background:#172b3beb;border:1px solid #55738b;border-radius:10px;padding:8px;max-height:74dvh;overflow:auto}
.panel summary{font-weight:700;cursor:pointer;padding:4px} .buttons{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px} button{background:#29445a;border:1px solid #6b8ca3;color:white;border-radius:7px;padding:7px 8px;cursor:pointer;font:inherit}button.active{background:#e2b56f;color:#1c2730}label{display:block;margin-top:9px;color:#cce0ef}input{width:100%;accent-color:#eab76f}
footer{position:fixed;left:8px;bottom:8px;z-index:3;background:#122332dc;border:1px solid #3b607a;border-radius:9px;padding:7px 10px;color:#b9d6e8;font-size:10px;max-width:min(650px,calc(100vw - 16px));line-height:1.55}
#mini{position:fixed;right:8px;bottom:76px;width:106px;height:194px;z-index:3;background:#102335e8;border:1px solid #5c8299;border-radius:6px}
#mini text{font-size:11px;fill:#f5f9fa}#mini .r{stroke:#79cdf6;stroke-width:1.8;stroke-dasharray:5 4}
@media(max-width:540px){header{max-width:calc(100vw - 110px)}header b{font-size:12px}header small{font-size:10px}.panel{width:104px}.panel:not([open]){height:38px}.panel[open]{width:min(205px,70vw)}#mini{width:88px;height:158px;bottom:83px}}
</style></head><body>
<canvas id="v"></canvas>
<header><b>三龙厂房｜钢结构＋屋面光伏</b><small>73.3m × 34m（纵横严格等比例）<br>斜角在左外边：33.6m开始，末端收进5m<br>从单坡到四组人字梁，屋脊沿34m方向<br><span id="count">计算中…</span></small></header>
<details class="panel" id="controls"><summary>☰ 控制</summary><div class="buttons"><button id="iso" class="active">轴测3D</button><button id="top">平面俯视</button><button id="front">端立面</button><button id="reset">复位</button></div><label>钢柱高度 <span id="hl">3.00m</span><input id="height" type="range" min="1.3" max="4.3" step="0.05" value="3"></label><div class="buttons"><button id="roof">隐藏屋面</button><button id="pv">隐藏光伏</button><button id="purlin">隐藏檩条</button></div><p style="font-size:10px;color:#b7d2df">单指拖动旋转、双指缩放；电脑滚轮缩放。模型为方向与排布校核，不作承载验算。</p></details>
<svg id="mini" viewBox="0 0 100 185" xmlns="http://www.w3.org/2000/svg" aria-label="外轮廓俯视：左侧斜角，长73.3米，宽34米">
<path d="M12 172H90V6H23.5L12 96Z" fill="#24495a" stroke="#f3b75b" stroke-width="2"/>
<path d="M12 153H90M12 115H90M14.6 77H90M19 39H90" class="r" fill="none"/>
<path d="M12 172H90" stroke="#e4eaf3"/><text x="30" y="182">宽34m</text><text x="6" y="91" transform="rotate(-90 6 91)">长73.3m</text><text x="28" y="14" fill="#ffbd9d">←收5m</text></svg>
<footer>基于原模型的四组人字梁＋一组单坡形式重画，保留升降高度控制。外轮廓按你手绘校核；4组人字梁每边暂按8.4m，单坡8.4m，末端超过73.3m部分裁掉。屋顶实际柱网、天沟、压块及荷载尚需CAD复核，不用于直接施工或订货。</footer>
<script>
(()=>{'use strict';
const c=document.getElementById('v'),ctx=c.getContext('2d'),countEl=document.getElementById('count');
let W=0,H=0,dpr=1,yaw=-.44,pitch=.77,zoom=1,h=3,showRoof=true,showPV=true,showPurlin=true;
const len=73.3,width=34,taperStart=33.6,taperIn=5,panelsX=2.382,panelsZ=1.134,pitchX=2.422,pitchZ=1.149;
const left=z=>5*Math.max(0,Math.min(1,(z-taperStart)/(len-taperStart)));
const zones=[{kind:'single',a:0,b:8.4},{kind:'gable',a:8.4,b:25.2},{kind:'gable',a:25.2,b:42},{kind:'gable',a:42,b:58.8},{kind:'gable',a:58.8,b:75.6}];
let faces=[],lines=[],modules=0;
function addFace(pts,fill,stroke=null,sw=.3){faces.push({pts,fill,stroke,sw});}
function addLine(a,b,color='#7ba2af',sw=1){lines.push({a,b,color,sw});}
function yAt(z,zone){if(zone.kind==='single')return h+.42*(1-z/8.4);let mid=(zone.a+zone.b)/2;return h+.78*(1-Math.abs(z-mid)/8.4);}
function segment(x,z0,z1,fn,color,sw){z1=Math.min(z1,len);if(z0>=len||z1<=z0)return;const minZ=z0,maxZ=z1;let r0=z0,r1=z1;if(x<left(r0)){return;}if(x<left(r1)){let low=r0,high=r1;for(let i=0;i<25;i++){let mid=(low+high)/2;if(x>=left(mid))low=mid;else high=mid;}r1=low;}if(r1-r0>.02)addLine([x,fn(r0),r0],[x,fn(r1),r1],color,sw);}
function build(){faces=[];lines=[];modules=0;
  // roof planes and PV are generated as true 3D plane patches, clipped to the perimeter.
  for(const zone of zones){const end=Math.min(len,zone.b);if(end<=zone.a)continue;
    const cuts=zone.kind==='single'?[zone.a,zone.b]:[zone.a,(zone.a+zone.b)/2,zone.b];
    for(let s=0;s<cuts.length-1;s++){
      const a=cuts[s],b=Math.min(end,cuts[s+1]);if(b<=a)continue;
      for(let z=a;z<b-.001;z+=1.2){const z2=Math.min(z+1.2,b),x0=left(z),x1=left(z2);
        if(showRoof)addFace([[x0,yAt(z,zone)+.18,z],[34,yAt(z,zone)+.18,z],[34,yAt(z2,zone)+.18,z2],[x1,yAt(z2,zone)+.18,z2]],'rgba(133,167,184,.33)');
      }
      if(showPV)for(let z=a+.14;z+panelsZ<=b-.1;z+=pitchZ)for(let x=.14;x+panelsX<=34-.1;x+=pitchX){
        if(x<Math.max(left(z),left(z+panelsZ))+.05)continue;
        addFace([[x,yAt(z,zone)+.37,z],[x+panelsX,yAt(z,zone)+.37,z],[x+panelsX,yAt(z+panelsZ,zone)+.37,z+panelsZ],[x,yAt(z+panelsZ,zone)+.37,z+panelsZ]],'#15486c','#7bc9e9',.55);modules++;
      }
    }
    // Main gable rafters travel across each gable's two slopes, not along the 73m ridge.
    const grids=[0,6.8,13.6,20.4,27.2,34];
    for(const x of grids)for(let s=0;s<cuts.length-1;s++)segment(x,cuts[s],cuts[s+1],z=>yAt(z,zone),'#bed1d5',2.1);
    if(showPurlin)for(let z=zone.a+.03;z<end;z+=1.2){
      const zc=Math.min(z,end),xx=left(zc);
      addLine([xx,yAt(zc,zone)+.12,zc],[34,yAt(zc,zone)+.12,zc],'#80a9a8',.9);
    }
    for(const zRaw of cuts){const z=Math.min(zRaw,len);if(z<0||z>len)continue;
      const ey=yAt(z,zone),xx=left(z);
      for(const x of grids){if(x+1e-3<xx)continue;addLine([x,0,z],[x,ey,z],'#d1a56d',1.6);addLine([x,.7,z],[x,ey,z],'#658398',.8);}
      if(xx>0){addLine([xx,0,z],[xx,ey,z],'#d1a56d',1.6);}
      // eave gutter / joints across the 34m axis
      if(zone.kind==='gable' && (Math.abs(z-zone.a)<.01||Math.abs(z-zone.b)<.01))
        addLine([xx,ey-.18,z],[34,ey-.18,z],'#66d1f7',2);
    }
  }
  // diagonal outer edge: structural boundary and the actual roof line obey the same cut.
  for(let z=taperStart;z<len;z+=1.4){const z2=Math.min(len,z+1.4);const zone=zones.find(q=>z>=q.a&&z<=q.b);const zone2=zones.find(q=>z2>=q.a&&z2<=q.b);
    if(zone&&zone2&&zone===zone2)addLine([left(z),yAt(z,zone)+.24,z],[left(z2),yAt(z2,zone)+.24,z2],'#f1b66a',2.3);
  }
  countEl.textContent='光伏几何示意：'+modules+'块（非采购数量）';
}
function size(){dpr=Math.min(devicePixelRatio||1,2);W=c.clientWidth;H=c.clientHeight;c.width=Math.round(W*dpr);c.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);draw();}
function project(p){const x=p[0]-17,y=p[1]-1.5,z=p[2]-36.65;
  const u=x*Math.cos(yaw)+z*Math.sin(yaw),v=-x*Math.sin(yaw)+z*Math.cos(yaw);
  const sc=Math.min(W/101,H/97)*zoom;
  return [W/2+u*sc,H/2+(v*Math.sin(pitch)-y*Math.cos(pitch))*sc,v];}
function draw(){if(!W||!H)return;ctx.clearRect(0,0,W,H);ctx.fillStyle='#090f1a';ctx.fillRect(0,0,W,H);
 ctx.strokeStyle='#263744';ctx.lineWidth=.5;for(let i=0;i<=34;i+=4){let a=project([i,-.05,0]),b=project([i,-.05,len]);ctx.beginPath();ctx.moveTo(...a.slice(0,2));ctx.lineTo(...b.slice(0,2));ctx.stroke();}
 for(let z=0;z<=len;z+=5){let a=project([0,-.05,z]),b=project([34,-.05,z]);ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();}
 const sorted=faces.map(f=>({f,depth:f.pts.reduce((s,p)=>s+project(p)[2],0)/f.pts.length})).sort((a,b)=>b.depth-a.depth);
 for(const t of sorted){const f=t.f;ctx.beginPath();f.pts.forEach((p,i)=>{let q=project(p);i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1])});ctx.closePath();ctx.fillStyle=f.fill;ctx.fill();if(f.stroke){ctx.strokeStyle=f.stroke;ctx.lineWidth=f.sw;ctx.stroke();}}
 for(const l of lines){const a=project(l.a),b=project(l.b);ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.lineWidth=l.sw;ctx.strokeStyle=l.color;ctx.stroke();}
 // boundary, dimension strokes and the little scale bar
 let path=[[0,0],[34,0],[34,len],[5,len],[0,33.6],[0,0]];
 ctx.beginPath();path.forEach((p,i)=>{let q=project([p[0],.02,p[1]]);i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1])});ctx.strokeStyle='#ffbe67';ctx.lineWidth=2;ctx.stroke();
 ctx.fillStyle='#dbe8ef';ctx.font='12px system-ui';ctx.fillText('斜角←5m',12,H-56);
 ctx.fillStyle='#8fadc4';ctx.fillText('长73.3m / 宽34m · 比例1:1',12,H-39);
}
function redraw(){build();draw();}
document.getElementById('height').oninput=e=>{h=+e.target.value;document.getElementById('hl').textContent=h.toFixed(2)+'m';redraw();};
const setView=(y,p,z,el)=>{yaw=y;pitch=p;zoom=z;document.querySelectorAll('.buttons button').forEach(q=>q.classList.remove('active'));document.getElementById(el).classList.add('active');draw();};
document.getElementById('iso').onclick=()=>setView(-.44,.77,1,'iso');
document.getElementById('top').onclick=()=>setView(0,Math.PI/2,1.15,'top');
document.getElementById('front').onclick=()=>setView(Math.PI/2,.15,1,'front');
document.getElementById('reset').onclick=()=>{h=3;document.getElementById('height').value='3';document.getElementById('hl').textContent='3.00m';showRoof=showPV=showPurlin=true;['roof','pv','purlin'].forEach(id=>document.getElementById(id).textContent={'roof':'隐藏屋面','pv':'隐藏光伏','purlin':'隐藏檩条'}[id]);setView(-.44,.77,1,'iso');redraw();};
for(const [id,enabled,setter,label] of [['roof',()=>showRoof,v=>showRoof=v,'屋面'],['pv',()=>showPV,v=>showPV=v,'光伏'],['purlin',()=>showPurlin,v=>showPurlin=v,'檩条']])document.getElementById(id).onclick=()=>{setter(!enabled());document.getElementById(id).textContent=(enabled()?'隐藏':'显示')+label;redraw();};
const pointers=new Map();let lastPinch=0;c.addEventListener('pointerdown',e=>{pointers.set(e.pointerId,[e.clientX,e.clientY]);c.setPointerCapture(e.pointerId)});
c.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;let old=pointers.get(e.pointerId);pointers.set(e.pointerId,[e.clientX,e.clientY]);if(pointers.size===1){yaw+=(e.clientX-old[0])*.009;pitch=Math.min(Math.PI/2,Math.max(.12,pitch-(e.clientY-old[1])*.006));draw();}else if(pointers.size===2){const a=[...pointers.values()],d=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);if(lastPinch)zoom=Math.max(.4,Math.min(3.5,zoom*d/lastPinch));lastPinch=d;draw();}});
const up=e=>{pointers.delete(e.pointerId);lastPinch=0};c.addEventListener('pointerup',up);c.addEventListener('pointercancel',up);
c.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.4,Math.min(3.5,zoom*(e.deltaY>0?.9:1.1)));draw()},{passive:false});
addEventListener('resize',size);build();size();
})();
</script></body></html>
