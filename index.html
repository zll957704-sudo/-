let detail=false;document.querySelector('#detail').onclick=e=>{detail=!detail;if(detail){overview=false;roofGroup.visible=false;purlinGroup.visible=false;highlight=true;jointGroup.visible=true;target.set(12,1.8,-16);dist=8;theta=-.8;phi=1.1;e.target.textContent='返回整体';}else{roofGroup.visible=true;purlinGroup.visible=true;target.set(36.65,1.7,-4.6);view('iso');e.target.textContent='升降柱近景';}updateCamera()};

renderer.domElement.addEventListener('pointerdown',e=>{pointer.set(e.pointerId,[e.clientX,e.clientY]);renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(!pointer.has(e.pointerId))return;const prev=pointer.get(e.pointerId);pointer.set(e.pointerId,[e.clientX,e.clientY]);if(pointer.size===1){theta+=(e.clientX-prev[0])*.007;phi=Math.max(.08,Math.min(Math.PI-.08,phi-(e.clientY-prev[1])*.007))}else{const p=[...pointer.values()],d=Math.hypot(p[0][0]-p[1][0],p[0][1]-p[1][1]);if(lastDistance&&d>0){zoomed=true;dist=Math.max(9,Math.min(Math.max(420,dist),dist*lastDistance/d));}lastDistance=d}updateCamera()});function release(e){pointer.delete(e.pointerId);lastDistance=0}renderer.domElement.addEventListener('pointerup',release);renderer.domElement.addEventListener('pointercancel',release);renderer.domElement.addEventListener('wheel',e=>{e.preventDefault();zoomed=true;dist=Math.max(9,Math.min(Math.max(420,dist),dist*(e.deltaY>0?1.09:.91)));updateCamera()},{passive:false});addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);if(overview&&!zoomed)fitOverview()});
